<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AngklungineX Arc-2</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1675466124/drawing_utils.js" crossorigin="anonymous"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header id="app-header">
      <h1>AngklungineX</h1>
      <div id="header-controls">
        <button id="btn-camera" class="btn-camera">📷 Camera</button>
        <div id="connection-status">
          <button id="btn-connect" class="btn-connect">🔌 Connect</button>
          <span id="status-text">Disconnected</span>
        </div>
      </div>
    </header>

    <!-- Navigation / Mode Selector -->
    <nav id="mode-nav">
      <button class="mode-btn active" data-mode="freemode">🎹 Free Play</button>
      <button class="mode-btn" data-mode="rhythm">🎮 Rhythm</button>
      <button class="mode-btn" data-mode="learning">📚 Learning</button>
    </nav>

    <!-- Mode Views -->
    <main id="main-content">
      <!-- Free Play -->
      <section id="view-freemode" class="mode-view active">
        <div id="camera-overlay" class="camera-overlay hidden">
          <video id="camera-video" playsinline></video>
          <canvas id="camera-canvas"></canvas>
        </div>
        <div id="piano-keys"></div>
      </section>

      <!-- Rhythm Mode -->
      <section id="view-rhythm" class="mode-view">
        <p>Rhythm Mode — coming soon</p>
      </section>

      <!-- Learning Mode -->
      <section id="view-learning" class="mode-view">
        <p>Learning Mode — coming soon</p>
      </section>
    </main>

    <footer>
      <p>I-Will Laboratory — ITENAS Bandung 2026</p>
    </footer>
  </div>

  <script src="js/serial.js"></script>
  <script src="js/freemode.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js');
    }
  </script>
</body>
</html>
